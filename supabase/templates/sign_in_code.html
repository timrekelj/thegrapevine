<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<title>Your sign-in code</title>
<!-- Apple Mail and some others load Gloock; the rest fall back to Georgia. -->
<link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; background: #EFEEE9;">
<div style="display: none; max-height: 0; overflow: hidden; opacity: 0;">Your sign-in code is {{ .Token }}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background: #EFEEE9;">
  <tr>
    <td align="center" style="padding: 40px 20px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 480px;">
        <tr>
          <td align="center" style="font-family: Gloock, Georgia, 'Times New Roman', serif; font-size: 30px; line-height: 1; letter-spacing: -0.02em; color: #4A2160; padding-bottom: 18px;">The Grapevine</td>
        </tr>
        <tr>
          <td style="border-top: 2px solid #4A2160; font-size: 0; line-height: 0;">&nbsp;</td>
        </tr>
        <tr>
          <td style="padding: 36px 0 10px; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6E5280;">Your sign-in code</td>
        </tr>
        <tr>
          <td style="font-family: Gloock, Georgia, 'Times New Roman', serif; font-size: 34px; line-height: 1.1; color: #4A2160; padding-bottom: 24px;">A paper between friends.</td>
        </tr>
        <tr>
          <td align="center" style="background: #F8F7F3; border: 1px solid #4A2160; border-radius: 2px; padding: 26px 12px;">
            <span style="font-family: Gloock, Georgia, 'Times New Roman', serif; font-size: 46px; line-height: 1; letter-spacing: 10px; padding-left: 10px; color: #4A2160;">{{ .Token }}</span>
          </td>
        </tr>
        <tr>
          <td style="padding: 24px 0 36px; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; font-size: 16px; line-height: 23px; color: #4A2160;">Enter this code in The Grapevine to sign in. It works once and expires in an hour.</td>
        </tr>
        <tr>
          <td style="border-top: 1px solid #BDB0C0; padding-top: 16px; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; font-size: 13px; line-height: 18px; color: #6E5280;">Sent to {{ .Email }}. If you didn't ask for a code, you can ignore this email — nobody can sign in without it.</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
