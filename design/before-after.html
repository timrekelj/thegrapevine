<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>The Grapevine: before and after</title>
<link rel="stylesheet" href="file:///Users/timrekelj/.claude/skills/app-designer-pro/assets/device.css">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=block" rel="stylesheet">
<style>
.stage[data-name="before-after"]{background:#F0F4EB;color:#15221B;font-family:var(--sf)}
.cols{position:absolute;inset:36px 48px 32px;display:flex;gap:56px;justify-content:center}
.col{display:flex;flex-direction:column;align-items:center;gap:14px}
.col .lbl{font:800 17px/1 "Bricolage Grotesque",var(--sf);letter-spacing:-.01em;color:#15221B}
.col .lbl span{font:400 13px/1 var(--sf);color:#5E6B63;margin-left:8px;letter-spacing:-.1px}
.col img{height:420px;width:auto;border-radius:24px;box-shadow:0 1px 1px rgba(21,34,27,.04),0 12px 30px -12px rgba(21,34,27,.16),inset 0 0 0 1px rgba(21,34,27,.04);display:block}
.col.after .lbl{color:#1E7A39}
</style></head>
<body>
<section class="screen" data-name="after-paper" data-chrome="none" style="background:#F0F4EB"><img src="shots/r6/paper.png" alt="" style="width:100%;height:100%;display:block"></section>
<section class="stage" data-name="before-after" data-size="16:9" data-palette="identity">
  <div class="cols">
    <div class="col"><div class="lbl">Before<span>the broadsheet, shipped 15 October</span></div><img src="shots/before/before-front.png" alt="The shipped front page: blackletter nameplate, halftone photo, serif headline, press red marks"></div>
    <div class="col after"><div class="lbl">After<span>the vine</span></div><img src="shots/r6/paper.png" alt="The redesigned front page: leaf-white ground, lit grapes per source, a green badge for what is new"></div>
    <div class="col after"><div class="lbl">After, at night<span>dark mode</span></div><img src="shots/r6/paper-dark.png" alt="The redesigned front page in dark mode"></div>
  </div>
</section>
<script src="file:///Users/timrekelj/.claude/skills/app-designer-pro/assets/device.js"></script>
