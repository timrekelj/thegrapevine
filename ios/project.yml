name: Grapevine
options:
  bundleIdPrefix: si.timrekelj
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
settings:
  SWIFT_VERSION: "5.10"
  # Shared so the push extension's version always matches the app's.
  MARKETING_VERSION: 0.1.0
  CURRENT_PROJECT_VERSION: "1"
packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    exactVersion: 3.92.0
  OneSignal:
    url: https://github.com/OneSignal/OneSignal-XCFramework
    exactVersion: 5.5.1
targets:
  Grapevine:
    type: application
    platform: iOS
    sources:
      - path: Grapevine
    info:
      path: Grapevine/Info.plist
      properties:
        CFBundleDisplayName: The Grapevine
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: si.timrekelj.thegrapevine.auth
            CFBundleURLSchemes: [grapevine]
        # Only standard HTTPS encryption, so no export-compliance documents are needed.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIAppFonts: [Gloock-Regular.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Grapevine/Grapevine.entitlements
      properties:
        # https://thegrapevine.si links open the app; the site serves the matching apple-app-site-association.
        com.apple.developer.associated-domains: [applinks:thegrapevine.si]
        com.apple.developer.applesignin: [Default]
        aps-environment: development
        com.apple.security.application-groups: [group.si.timrekelj.thegrapevine.onesignal]
        # The app's own default group, listed so the share extension can read the saved session.
        keychain-access-groups: [$(AppIdentifierPrefix)si.timrekelj.thegrapevine]
    dependencies:
      - package: PostHog
      - target: OneSignalNotificationServiceExtension
      - target: ShareExtension
      - package: OneSignal
        product: OneSignalFramework
      - package: OneSignal
        product: OneSignalInAppMessages
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: si.timrekelj.thegrapevine
      TARGETED_DEVICE_FAMILY: "1"
      GENERATE_INFOPLIST_FILE: true
      ENABLE_USER_SCRIPT_SANDBOXING: false
    postBuildScripts:
      - name: Upload PostHog symbols
        script: |
          if [ "$CONFIGURATION" = "Release" ] && [ -n "$POSTHOG_CLI_API_KEY" ]; then
            export POSTHOG_CLI_HOST=https://eu.posthog.com
            export POSTHOG_CLI_PROJECT_ID=310029
            export POSTHOG_SKIP_ON_CONFLICT=1
            "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/posthog-ios/build-tools/upload-symbols.sh"
          fi
        inputFiles:
          - $(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)/Contents/Resources/DWARF/$(EXECUTABLE_NAME)
        runOnlyWhenInstalling: true
    scheme:
      testTargets: [GrapevineTests]
  OneSignalNotificationServiceExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: OneSignalNotificationServiceExtension
    info:
      path: OneSignalNotificationServiceExtension/Info.plist
      properties:
        CFBundleDisplayName: OneSignalNotificationServiceExtension
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: OneSignalNotificationServiceExtension/OneSignalNotificationServiceExtension.entitlements
      properties:
        # Must match the app's App Group exactly, or Confirmed Delivery and badges silently fail.
        com.apple.security.application-groups: [group.si.timrekelj.thegrapevine.onesignal]
    dependencies:
      - package: OneSignal
        product: OneSignalExtension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: si.timrekelj.thegrapevine.OneSignalNotificationServiceExtension
      TARGETED_DEVICE_FAMILY: "1"
      GENERATE_INFOPLIST_FILE: true
  ShareExtension:
    type: app-extension
    platform: iOS
    # "The Grapevine" in other apps' share sheets; reuses the app's share form and API client.
    sources:
      - path: ShareExtension
      - path: Grapevine/API.swift
      - path: Grapevine/Config.swift
      - path: Grapevine/Keychain.swift
      - path: Grapevine/Models.swift
      - path: Grapevine/Theme.swift
      - path: Grapevine/Views/ShareView.swift
      - path: Grapevine/Resources/Gloock-Regular.ttf
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: The Grapevine
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [Gloock-Regular.ttf]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        # The app's keychain group, where it saves the session.
        keychain-access-groups: [$(AppIdentifierPrefix)si.timrekelj.thegrapevine]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: si.timrekelj.thegrapevine.ShareExtension
      TARGETED_DEVICE_FAMILY: "1"
      GENERATE_INFOPLIST_FILE: true
  GrapevineTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GrapevineTests]
    dependencies:
      - target: Grapevine
    settings:
      GENERATE_INFOPLIST_FILE: true
