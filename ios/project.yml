name: Grapevine
options:
  bundleIdPrefix: si.timrekelj
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
settings:
  SWIFT_VERSION: "5.10"
targets:
  Grapevine:
    type: application
    platform: iOS
    sources:
      - path: Grapevine
    info:
      path: Grapevine/Info.plist
      properties:
        CFBundleDisplayName: The Grapevine
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only standard HTTPS encryption, so no export-compliance documents are needed.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIAppFonts: [Gloock-Regular.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Grapevine/Grapevine.entitlements
      properties:
        # https://thegrapevine.si links open the app; the site serves the matching apple-app-site-association.
        com.apple.developer.associated-domains: [applinks:thegrapevine.si]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: si.timrekelj.thegrapevine
      TARGETED_DEVICE_FAMILY: "1"
      MARKETING_VERSION: 0.1.0
      CURRENT_PROJECT_VERSION: "1"
      GENERATE_INFOPLIST_FILE: true
    scheme:
      testTargets: [GrapevineTests]
  GrapevineTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GrapevineTests]
    dependencies:
      - target: Grapevine
    settings:
      GENERATE_INFOPLIST_FILE: true
